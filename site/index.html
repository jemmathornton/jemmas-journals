<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">   <!-- a whole page now, not a fragment (round 3 review: online and on 8050 it opened in quirks mode, 980px wide on phones) -->
<title>Jemma’s Journals</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#8E6520" data-dark="#6A4A17">
<meta name="robots" content="noindex, noai, noimageai">   <!-- her choice, 20 Nov: keep out of search engines and AI -->
<script src="family/mode.js" data-old-key="jj-mode2"></script>   <!-- the family’s shared dark mode, set before the page draws (site/family/) -->
<link rel="stylesheet" href="family/family.css">
<script src="family/family.js" defer></script>
<!-- Tab icon: drawn by Jemma (20 Nov, simpler redraw: cream square, old gold book, her two J’s); made by tools/draw-icon.html.
     Light is the default; in dark mode the script swaps to the flipped version (icon-dark-*), colours swapped like the page. -->
<link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48" data-dark="img/icon/icon-dark-32.png">
<link rel="icon" href="img/icon/icon-192.png" type="image/png" sizes="192x192" data-dark="img/icon/icon-dark-192.png">
<link rel="apple-touch-icon" href="img/icon/apple-touch-icon.png">
<style>
body{margin:0}img{max-width:100%}[hidden]{display:none!important}   /* what the artifact skeleton used to add */
/* Jemma's Journals: home page. 20 Nov 2026 (morning): her picks are the Improved version and About this site (laid out across the footer).
   Round 9 notes follow (the As now version and the other extras were taken out; they're in git history). */
/* Jemma's Journals: home page, round 9 (20 Nov 2026).
   Her picks: the Cloth cover banner with the title on a label; places as photos in album corners; names "My Sim World", "My Library", "My Pokédex";
   Library's picture is the tilted wall of covers; Sim World and Pokédex show a full map (which ones is still open; pictures parked for now). Light mode by default.
   This round: behind-the-scenes basics (skip link, picture descriptions, lazy loading, keyboard focus), and an "Improved" version beside "As now" (switch, bottom right).
   Only the photo and "Open …" are links. Places come from one list (PLACES). Fonts: Instrument Serif + Manrope (local, SIL OFL). Icons: Lucide (ISC). */
@font-face{font-family:"Instrument Serif";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/instrument-serif-latin.woff2) format("woff2")}
@font-face{font-family:"Instrument Serif";font-style:italic;font-weight:400;font-display:swap;src:url(fonts/instrument-serif-italic-latin.woff2) format("woff2")}
@font-face{font-family:"Manrope";font-style:normal;font-weight:200 800;font-display:swap;src:url(fonts/manrope-latin.woff2) format("woff2")}

:root{
  /* cream page, ink, a muted gold; the banner is navy cloth with a cream title label */
  --bg:#F4EEE3; --ink:#221D17; --soft-ink:#463D33; --mute:#6E6458; --line:#DDD3C3; --acc:#8A661E; --mat:#FFFDF8; --cover:#8E6520; --cover-hi:#C2943F; --deco:#F3EBDA; --gold:#E4C072; --label:#F3EBDA; --label-ink:#29221B;
  --display:"Instrument Serif","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --body:"Manrope","Segoe UI",system-ui,sans-serif;
  --g:clamp(16px,4vw,56px); --frame:max(calc(var(--g) - 20px),12px);
  color-scheme:light;
}
/* dark only when the button is pressed (her choice: light by default) */
:root[data-mode="dark"]{
  --bg:#29221B; --ink:#EFE9DE; --soft-ink:#D6CEC1; --mute:#A89F91; --line:#40362B; --acc:#DDB86A; --mat:#E9E2D4; --cover:#6A4A17; --cover-hi:#93702F;
  color-scheme:dark }
/* dark mode turns the light things dark (her ask, 20 Nov): the title label and the photo mats go blackish, the photo corners go cream-white */
:root[data-mode="dark"]{--label:var(--bg); --label-ink:#F3EBDA}   /* same as the page, as the cream label matches the cream page in light */
:root[data-mode="dark"] .v2{--mat:#0D0A07}   /* warm blacks, to mirror the cream (her ask, 20 Nov) */
:root[data-mode="dark"] .cover h1{outline-color:rgba(243,235,218,.22)}
:root[data-mode="dark"] .cover h1 em{color:var(--gold)}
:root[data-mode="dark"] .c{background:#F3EBDA;box-shadow:0 1px 2px rgba(0,0,0,.6)}
:root[data-mode="dark"] .snap{box-shadow:0 14px 30px -14px rgba(0,0,0,.9),0 0 0 1px rgba(243,235,218,.08)}

*{box-sizing:border-box}
html{background:var(--bg);scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.65 var(--body);-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit}
img{max-width:100%}
h1,h2,h3,p{margin:0;font-weight:400}
h1,h2,h3{text-wrap:balance}
p{text-wrap:pretty}   /* no lonely last word on a line */
svg.i{width:1em;height:1em;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:4px}
.gut{padding-left:max(var(--g),env(safe-area-inset-left,0px));padding-right:max(var(--g),env(safe-area-inset-right,0px))}
.wrap{max-width:1160px;margin:0 auto}
.skip{position:absolute;left:-999px;top:10px;z-index:100;padding:10px 16px;border-radius:8px;background:var(--label);color:var(--label-ink);font-weight:700;text-decoration:none}
.skip:focus{left:max(var(--g),env(safe-area-inset-left,0px))}

/* ---- the banner: a navy cloth journal cover with a title label */
.cover:focus{outline:none}
.cover{position:relative;padding-block:clamp(54px,6vw,84px) clamp(50px,5.4vw,72px);text-align:center;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.018) 0 1px,transparent 1px 3px),repeating-linear-gradient(90deg,rgba(0,0,0,.035) 0 1px,transparent 1px 3px),
    radial-gradient(110% 120% at 30% 0%,color-mix(in srgb,var(--cover) 82%,var(--cover-hi,#4a5a8a)),var(--cover) 60%,color-mix(in srgb,var(--cover) 80%,#000));
  box-shadow:inset 0 -2px 0 rgba(0,0,0,.25),0 18px 30px -22px rgba(0,0,0,.7)}
.cover::before{content:"";position:absolute;inset:16px var(--frame);border:1.5px solid color-mix(in srgb,var(--deco,var(--gold)) 50%,transparent);border-radius:4px;pointer-events:none}
/* the dark mode button sits in the footer beside Back to top (her pick, 20 Nov: keep the header clean) */
.mode-text{display:inline-flex;align-items:center;gap:6px;border:0;background:none;padding:4px 2px;font:700 13px var(--body);color:var(--acc);cursor:pointer}
.mode-text svg.i{width:14px;height:14px}
.mode-text:hover{text-decoration:underline;text-underline-offset:3px}
.foot-links{display:flex;gap:26px;justify-content:center;align-items:center;flex-wrap:wrap;margin-top:6px}
.v2 .foot-links .totop,.v2 .foot-links .mode-text{margin:0;padding:4px 2px;min-height:44px;font:700 13px/1 var(--body);gap:6px}
.foot-links .mode-text svg.i,.foot-links .totop svg.i{width:14px;height:14px}
.cover h1{display:inline-block;font:400 clamp(44px,6.6vw,96px)/1 var(--display);letter-spacing:-.025em;background:var(--label);color:var(--label-ink);padding:.2em .5em .22em;border-radius:4px;
  box-shadow:0 10px 24px -12px rgba(0,0,0,.7);outline:1.5px solid rgba(41,34,27,.32);outline-offset:-8px}
.cover h1 em{color:#8E6A22}

/* ---- Introduction (was About me) */
.intro{display:grid;grid-template-columns:180px minmax(0,1fr);gap:28px 48px;align-items:center;max-width:900px;margin:clamp(56px,6vw,80px) auto 0}
.intro p{font:400 clamp(22px,2.2vw,27px)/1.45 var(--display)}
.ph{color:var(--mute);font-style:italic}
.ph-tag{display:inline-block;font:700 10px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;padding:4px 7px;border-radius:99px;border:1px dashed var(--mute);color:var(--mute);vertical-align:middle;margin-left:8px;font-style:normal}

/* ---- Contents: the places */
.sec{display:flex;align-items:center;gap:16px;margin:clamp(56px,6vw,80px) 0 34px}
.sec i{flex:1;height:1px;background:var(--line)}
/* the places: three to a row; as more are added the rows stay tidy (4 = 2×2, 5 = 3 + 2 centred, 6 = 3 + 3) */
.cards{display:flex;flex-wrap:wrap;justify-content:center;gap:52px 40px}
.cards>.card{flex:0 0 calc((100% - 80px) / 3)}
/* four places: two to a row across the full width, lined up with the headings (her pick, 21 Nov) */
.cards:has(>.card:nth-child(4):last-child)>.card{flex-basis:calc((100% - 40px) / 2)}
.card{display:flex;flex-direction:column;min-width:0}
.card h3{font:400 40px/1.05 var(--display);margin-bottom:10px}
.card p{font-size:15.5px;margin-bottom:16px}
.card p.ph{font-size:15px}
/* only these two are links: the photo and "Open …" */
.snap{position:relative;display:block;aspect-ratio:4/3;background:var(--mat);padding:12px;box-shadow:0 14px 30px -18px rgba(0,0,0,.55);margin-bottom:22px;transition:box-shadow .3s,transform .3s}
.snap:hover{box-shadow:0 20px 36px -18px rgba(0,0,0,.6);transform:translateY(-2px)}
.snap .pic{inset:12px}
.c{position:absolute;z-index:2;width:24px;height:24px;background:linear-gradient(135deg,#3B3530,#1C1916);box-shadow:0 1px 2px rgba(0,0,0,.3)}
.c.tl{top:5px;left:5px;clip-path:polygon(0 0,100% 0,0 100%)}
.c.tr{top:5px;right:5px;clip-path:polygon(0 0,100% 0,100% 100%)}
.c.bl{bottom:5px;left:5px;clip-path:polygon(0 0,0 100%,100% 100%)}
.c.br{bottom:5px;right:5px;clip-path:polygon(100% 0,100% 100%,0 100%)}
.go{margin-top:auto;align-self:flex-start;display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:15px;color:var(--acc);text-decoration:none;padding:2px 0;border-bottom:1.5px solid transparent;transition:border-color .2s}
.go:hover{border-bottom-color:currentColor}
.go svg.i{transition:transform .25s}
.go:hover svg.i{transform:translateX(4px)}

/* ---- the pictures */
.pic{position:absolute;inset:0;overflow:hidden;background:#222}
.pic>img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.pic.map{background:var(--mat)}
.pic.map>img.bg{object-fit:contain}
.pic .wall{position:absolute;inset:-34% -14%;display:grid;grid-template-columns:repeat(8,1fr);gap:6px;transform:rotate(-8deg);transition:transform 1s cubic-bezier(.2,.7,.2,1)}
.snap:hover .pic .wall{transform:rotate(-8deg) scale(1.04)}
.pic .wall img{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:2px 3px 3px 2px;display:block}
.pic.blank{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--pc) 88%,#fff) 0 14px,var(--pc) 14px 28px)}

.foot{margin-top:clamp(72px,8vw,110px);border-top:1px solid var(--line)}
.foot .wrap{display:flex;justify-content:space-between;align-items:baseline;gap:8px 24px;flex-wrap:wrap;padding-block:26px 56px;font-size:12px;color:var(--mute)}
.foot b{font:400 20px/1 var(--display);color:var(--ink)}
.totop{display:none}

/* ================================================================ Improved (v2): refinements to try, beside "As now" */
/* the cover gets gold corner brackets, like a bound journal */
.v2 .cover .cn{position:absolute;width:30px;height:30px;pointer-events:none;color:var(--deco,var(--gold));opacity:.85}
.v2 .cover .cn::after{content:"";position:absolute;width:14px;height:14px;border-color:inherit}
.v2 .cover .cn.tl{top:24px;left:calc(var(--frame) + 8px);border-top:2px solid;border-left:2px solid}
.v2 .cover .cn.tr{top:24px;right:calc(var(--frame) + 8px);border-top:2px solid;border-right:2px solid}
.v2 .cover .cn.bl{bottom:24px;left:calc(var(--frame) + 8px);border-bottom:2px solid;border-left:2px solid}
.v2 .cover .cn.br{bottom:24px;right:calc(var(--frame) + 8px);border-bottom:2px solid;border-right:2px solid}
.v2 .cover .cn.tl::after{top:5px;left:5px;border-top:1px solid;border-left:1px solid}
.v2 .cover .cn.tr::after{top:5px;right:5px;border-top:1px solid;border-right:1px solid}
.v2 .cover .cn.bl::after{bottom:5px;left:5px;border-bottom:1px solid;border-left:1px solid}
.v2 .cover .cn.br::after{bottom:5px;right:5px;border-bottom:1px solid;border-right:1px solid}
/* section headings: a proper heading with a gold diamond rule, like a chapter title */
.v2 .h2{display:flex;align-items:center;gap:16px;flex:1}
.v2 .sec{display:flex}
.v2 .h2 h2{font:400 clamp(32px,3.2vw,42px)/1 var(--display);white-space:nowrap}
.v2 .h2 .rule{flex:1;display:flex;align-items:center;gap:10px;color:var(--acc)}
.v2 .h2 .rule i{flex:1;height:1px;background:linear-gradient(90deg,color-mix(in srgb,var(--acc) 55%,transparent),var(--line) 60%,transparent)}
.v2 .h2 .rule b{width:7px;height:7px;transform:rotate(45deg);background:currentColor;flex:none}
/* Introduction */
.v2 .intro{grid-template-columns:minmax(0,1fr);align-items:start;max-width:none}   /* words only, no photo (her ask, 20 Nov); lines up with Contents */
.v2 .intro p{max-width:780px}
.v2 .intro .h2{margin:6px 0 16px}
.v2 .intro p{color:var(--soft-ink)}
.v2 .intro p.ph{color:var(--mute)}
/* the places: softer description ink, a clearer link */
.v2 .sec{margin:clamp(64px,7vw,96px) 0 36px}
.v2 .card h3{font-size:42px}
.v2 .card p{color:var(--soft-ink)}
.v2 .card p.ph{color:var(--mute)}
.v2 .go{border-bottom:1.5px solid color-mix(in srgb,var(--acc) 35%,transparent)}
.v2 .go:hover{border-bottom-color:var(--acc)}
/* the end of the page: a closing mark, a centred footer and a way back up */
.v2 .end{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:clamp(72px,8vw,110px);color:var(--acc)}
.v2 .end i{width:90px;height:1px;background:linear-gradient(90deg,transparent,var(--acc))}
.v2 .end i:last-child{transform:scaleX(-1)}
.v2 .end b{width:8px;height:8px;transform:rotate(45deg);background:currentColor}
.v2 .foot{margin-top:28px;border-top:0}
.v2 .foot .wrap{flex-direction:column;align-items:center;text-align:center;gap:10px}
.v2 .foot b{font-size:24px}
.v2 .totop{display:inline-flex;align-items:center;gap:6px;margin-top:6px;font-weight:700;font-size:13px;color:var(--acc);text-decoration:none}
.v2 .totop svg.i{width:14px;height:14px}

/* ================================================================ About this site (her pick, 20 Nov: two short lines, small and quiet) */
.about-site{max-width:760px;font-size:12.5px;line-height:1.7;color:var(--mute)}
.about-site .dot{margin:0 3px;color:color-mix(in srgb,var(--acc) 60%,transparent)}
.about-site.two p{margin:0;text-wrap:balance}
.foot .about-site.two{max-width:none}
.about-site .cr{white-space:nowrap}   /* each credit stays in one piece when the line wraps */

/* ================================================================ Whole-page touches she kept (20 Nov) */
/* stitching round the cover (her pick, 20 Nov) */
.cover::after{content:"";position:absolute;inset:7px max(calc(var(--frame) - 9px),5px);border:1.5px dashed color-mix(in srgb,var(--deco,var(--gold)) 38%,transparent);border-radius:3px;pointer-events:none}
/* gentle entrance (her pick, 20 Nov): sections fade up softly once, as the page opens (not for anyone who has reduced motion turned on) */
@media (prefers-reduced-motion: no-preference){
  .i-enter .intro,.i-enter .sec,.i-enter .card,.i-enter .end,.i-enter .foot{animation:jj-in .7s cubic-bezier(.2,.7,.2,1) both}
  .i-enter .sec{animation-delay:.12s}.i-enter .card:nth-child(1){animation-delay:.2s}.i-enter .card:nth-child(2){animation-delay:.28s}.i-enter .card:nth-child(3){animation-delay:.36s}
  .i-enter .card:nth-child(n+4){animation-delay:.42s}.i-enter .end,.i-enter .foot{animation-delay:.45s}
}

@keyframes jj-in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

.toast{position:fixed;z-index:60;left:50%;bottom:calc(120px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:13.5px;font-weight:700;box-shadow:0 10px 30px -8px rgba(0,0,0,.4);white-space:nowrap}

@media (prefers-reduced-motion: reduce){*{transition:none!important} html{scroll-behavior:auto}}

@media (max-width:900px){ .cards>.card,.cards:has(>.card:nth-child(4):last-child)>.card{flex-basis:calc((100% - 40px) / 2)} }
@media (max-width:760px){
  body{font-size:15.5px}
  .cover{padding-block:66px 46px}
  .cover h1{font-size:40px;padding:.22em .45em .24em;outline-offset:-6px}
  .intro{grid-template-columns:96px minmax(0,1fr);gap:18px 20px;align-items:start}
  .intro p{font-size:20px}
  .cards{gap:44px}
  .cards>.card,.cards:has(>.card:nth-child(4):last-child)>.card{flex-basis:100%}
  .card h3{font-size:36px}
  .v2 .cover .cn{width:20px;height:20px}
  .v2 .cover .cn::after{width:9px;height:9px}
  .v2 .cover .cn.tl,.v2 .cover .cn.tr{top:22px}.v2 .cover .cn.bl,.v2 .cover .cn.br{bottom:22px}
  .v2 .intro{grid-template-columns:minmax(0,1fr);gap:16px 18px}
  .v2 .intro .h2{margin:0 0 10px}
  .v2 .h2 h2{font-size:32px}
  .v2 .card h3{font-size:38px}
  .about-site{font-size:12.5px}
  .about-site .dot{display:none}
  .about-site .cr{display:block}
}
</style>
</head>
<body>

<div id="page"></div>

<div class="toast" id="toast" role="status" hidden></div>

<script>
(function(){
  // The places. A new one is one more line here. "about" is a line from that app's own home page; null means a space for her words.
  // Pictures are parked for now (her call, 20 Nov): Sim World and Pokédex show a full map until she chooses.
  // all sites share one address: home at the root, each app under its folder name in Jemma’s Journals (her names, 21 Nov); online, or on her PC through tools/serve_all.py (port 8050); set HOME_DOMAIN if she buys her own
  var HOME_DOMAIN='', ONLINE=/github\.io$/.test(location.hostname) || (HOME_DOMAIN && location.hostname===HOME_DOMAIN) || (/^(localhost|127\.0\.0\.1)$/.test(location.hostname) && location.port==='8050');
  var PLACES=[
    {name:"Sim World", url:"/sim-world/", title:"My Sim World", pc:"#4E3182", pic:{img:"img/maps/sims-willow-creek.webp", map:true, alt:"Map of Willow Creek"},
     about:"Every world in the game, rebuilt one lot at a time. Wander the neighbourhoods, look around the homes and venues, and meet the households who live in them."},
    {name:"Library", url:"/library/", title:"My Library", pc:"#6E4524", pic:{wall:true, alt:"Covers of books from my shelves"},
     about:"Every book on the shelves at home, and everything you read."},
    {name:"Pokédex", url:"/pokedex/", title:"My Pokédex", pc:"#7E2530", pic:{img:"img/maps/region-johto-kanto.webp", map:true, alt:"Map of Johto and Kanto"},
     about:null},
    {name:"Travels", url:"/travels/", title:"My Travels", pc:"#1D7A69", pic:{img:"img/maps/travels-map.webp", map:true, alt:"Map of the places on my trips"},
     about:null}   // added 21 Nov (her yes); the picture is Travels' own map in its chosen Old Atlas look
  ];
  // Only for "More places": stand-ins to show how it grows. Not real places.
  var EXTRA=[{name:"New place",title:"New place",pc:"#35606F",demo:true},{name:"New place",title:"New place",pc:"#8A6A3A",demo:true},{name:"New place",title:"New place",pc:"#5A5F73",demo:true}];
  var ICON={
    "arrow-right":'<path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>',
    "arrow-up":'<path d="m5 12 7-7 7 7"/><path d="M12 19V5"/>',
    "plus":'<path d="M5 12h14"/><path d="M12 5v14"/>',
    "image":'<rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/>',
    "sun":'<circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/>',
    "moon":'<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>'
  };
  function ico(n){ return '<svg class="i" viewBox="0 0 24 24" aria-hidden="true">'+ICON[n]+'</svg>'; }
  function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
  var WALL=''; for(var n=0;n<72;n++) WALL+='<img src="img/wall/'+String((n*7)%40).padStart(2,'0')+'.webp" alt="" loading="lazy" decoding="async">';
  function pic(p){
    if(p.demo) return '<span class="pic blank" style="--pc:'+p.pc+'"></span>';
    var q=p.pic;
    if(q.wall) return '<span class="pic" role="img" aria-label="'+esc(q.alt)+'"><span class="wall">'+WALL+'</span></span>';
    return '<span class="pic'+(q.map?' map':'')+'"><img class="bg" src="'+q.img+'" alt="'+esc(q.alt||'')+'" loading="lazy" decoding="async"></span>';
  }
  function aboutPlace(p){ return p.about ? '<p>'+esc(p.about)+'</p>' : '<p class="ph">A line or two about '+(p.demo?'it':esc(p.name))+', in your own words.<span class="ph-tag">Placeholder</span></p>'; }
  var CORNERS='<span class="c tl"></span><span class="c tr"></span><span class="c bl"></span><span class="c br"></span>';
  function h2(text,id){ return '<div class="h2"><h2'+(id?' id="'+id+'"':'')+'>'+text+'</h2><span class="rule"><i></i><b></b></span></div>'; }

  // state: more places (to show how it grows), light/dark (light unless the button is pressed). Her picks: the Improved version, with About this site.
  var more=0, root=document.documentElement, userMode=root.getAttribute('data-mode')==='dark'?'dark':'light';   // more: how many stand-in places to add (0–3); the mode was set by the family's mode.js
  location.hash.slice(1).split('--').forEach(function(w){ if(w==='more') more=3; var mm=/^more([123])$/.exec(w); if(mm) more=+mm[1]; if(w==='dark'||w==='light') userMode=w;
    });

  // About this site: two quiet lines (her pick, 20 Nov: option 2, each credit starting with a capital)
  var DOT='<span class="dot" aria-hidden="true"> ·</span>';   // the no-break space sits inside the dot, so a “·” never starts a line and on phones (dots hidden) no empty line is left
  function aboutSite(){
    return '<div class="about-site two"><p data-jj-line1>No cookies, no tracking, no ads. Made with HTML, CSS and JavaScript, kept on GitHub.</p>'
      +'<p data-jj-credits>'+['World maps by 20th Century Plumbob','Region maps from the Pokémon games','Country shapes from Natural Earth','Book covers from their publishers','Fonts: Instrument Serif and Manrope','Icons by Lucide'].map(function(t){ return '<span class="cr">'+t+'</span>'; }).join(DOT+' ')+'</p></div>';
  }
  root.setAttribute('data-mode', userMode);   // #dark / #light in the address (for checking); the theme colour and tab icon follow through family.js (round 4: this page's own copy left the bar colour stuck)

  var firstRender=true;   // the gentle entrance plays once, when the page first opens
  function render(){
    var list=PLACES.concat(EXTRA.slice(0,more)), dark=userMode==='dark';
    var MODETEXT='<button type="button" class="mode-text" data-jj-mode aria-pressed="'+dark+'">'+ico(dark?'sun':'moon')+(dark?'Light mode':'Dark mode')+'</button>';
    var h='<a class="skip" href="#contents">Skip to contents</a>'
      +'<header class="cover gut" id="top" tabindex="-1"><span class="cn tl"></span><span class="cn tr"></span><span class="cn bl"></span><span class="cn br"></span>'
      +'<div class="wrap"><h1>Jemma’s <em>Journals</em></h1></div>'
      +'</header>'
      +'<main class="gut"><div class="wrap">';
    var INTRO='<p class="ph">An introduction to the site goes here, in your own words: what these journals are and what you’ll find in them.<span class="ph-tag">Placeholder</span></p>';
    h+='<section class="intro" aria-labelledby="intro"><div>'+h2('Introduction','intro')+INTRO+'</div></section>'   // Introduction to the site, words only (her picks, 20 Nov)
      +'<div class="sec">'+h2('Contents','contents')+'</div>'
      +'<div class="cards">';
    list.forEach(function(p){
      var open=p.demo?'it':p.title;   // "Open My Sim World" (her ask, 20 Nov: the link should say My like the heading)
      h+='<article class="card" style="--pc:'+p.pc+'">'
        +'<a class="snap" href="'+esc(p.url||'#')+'" data-open="'+esc(p.demo?'':p.name)+'" aria-label="Open '+esc(open)+'">'+CORNERS+pic(p)+'</a>'
        +'<h3>'+esc(p.title)+'</h3>'+aboutPlace(p)
        +'<a class="go" href="'+esc(p.url||'#')+'" data-open="'+esc(p.demo?'':p.name)+'">Open '+esc(open)+' '+ico('arrow-right')+'</a></article>';
    });
    h+='</div></div></main>'
      +'<div class="end" aria-hidden="true"><i></i><b></b><i></i></div>'
      +'<footer class="foot gut"><div class="wrap"><b>Jemma’s Journals</b>'+aboutSite()
      +'<div class="foot-links"><a class="totop" href="#top" data-jj-top>'+ico('arrow-up')+'Back to top</a>'+MODETEXT+'</div>'+'</div></footer>';
    var page=document.getElementById('page'); page.className='v2'+(firstRender?' i-enter':''); firstRender=false; page.innerHTML=h;
  }
  // title on scroll: show the slim bar once the banner has scrolled out of sight
  render();

  var toast=document.getElementById('toast'), t;
  function say(m){ toast.textContent=m; toast.hidden=false; clearTimeout(t); t=setTimeout(function(){ toast.hidden=true; },1800); }
  document.addEventListener('click',function(e){
    // Back to top and Dark mode: the family’s shared code (site/family/family.js)
    var a=e.target.closest('a[data-open]'); if(!a) return;
    if(ONLINE && a.getAttribute('href')!=='#') return;   // online, the links go to the apps
    e.preventDefault();
    say(a.dataset.open ? 'My '+a.dataset.open+' opens here once the sites are online' : 'A new place would go here');
  });
})();
</script>
</body>
</html>
