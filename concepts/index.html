<title>Jemma’s Journals</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Jemma's Journals: home page, round 7 (19 Nov 2026). Her pick: the Cloth cover banner with the places as photos in album corners.
   This round: only the photo and the "Open" link are clickable; the J is no longer clipped; the "Open" links line up; the About block sits centred under the title;
   the light/dark button sits inside the banner frame; a shorter banner; smaller photo corners. Choices to try (switch, bottom right): Pictures 1–3, Names 1–3, Title 1–3.
   Places come from one list (PLACES). Fonts: Instrument Serif + Manrope (local, SIL OFL). Icons: Lucide (ISC).
   Earlier rounds are in git history and in for-jemma/concepts/. */
@font-face{font-family:"Instrument Serif";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/instrument-serif-latin.woff2) format("woff2")}
@font-face{font-family:"Instrument Serif";font-style:italic;font-weight:400;font-display:swap;src:url(fonts/instrument-serif-italic-latin.woff2) format("woff2")}
@font-face{font-family:"Manrope";font-style:normal;font-weight:200 800;font-display:swap;src:url(fonts/manrope-latin.woff2) format("woff2")}

:root{
  /* cream page, ink, a muted gold; the banner is navy cloth */
  --bg:#F4EEE3; --ink:#221D17; --mute:#776D60; --line:#DDD3C3; --acc:#8E6A22; --mat:#FFFDF8; --cover:#1C2540; --cover-ink:#F4EDDF; --gold:#E4C072; --walnut:#3B2616;
  --display:"Instrument Serif","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --body:"Manrope","Segoe UI",system-ui,sans-serif;
  --g:clamp(16px,4vw,56px); --frame:max(calc(var(--g) - 20px),12px);
  --sw-bg:#FFFFFF; --sw-ink:#1A1F2C; --sw-mute:#6B7280; --sw-line:#E1E4EA; --sw-on:#1A1F2C; --sw-on-ink:#FFFFFF;
}
:root[data-mode="dark"]{
  --bg:#15130F; --ink:#EFE9DE; --mute:#A89F91; --line:#2F2A23; --acc:#DDB86A; --mat:#E9E2D4; --cover:#131A30;
  --sw-bg:#1E2330; --sw-ink:#ECEEF3; --sw-mute:#9AA1B2; --sw-line:#30364A; --sw-on:#ECEEF3; --sw-on-ink:#151923; color-scheme:dark }

*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.65 var(--body);-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit}
img{max-width:100%}
h1,h2,h3,p{margin:0;font-weight:400}
svg.i{width:1em;height:1em;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:2px solid currentColor;outline-offset:3px;border-radius:4px}
.gut{padding-left:max(var(--g),env(safe-area-inset-left,0px));padding-right:max(var(--g),env(safe-area-inset-right,0px))}
.lab{font:700 11px/1.2 var(--body);letter-spacing:.16em;text-transform:uppercase}
.wrap{max-width:1160px;margin:0 auto}

/* ---- the banner: a navy cloth journal cover */
.cover{position:relative;color:var(--gold);padding-block:clamp(54px,6vw,84px) clamp(46px,5vw,66px);text-align:center;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.018) 0 1px,transparent 1px 3px),repeating-linear-gradient(90deg,rgba(0,0,0,.035) 0 1px,transparent 1px 3px),
    radial-gradient(110% 120% at 30% 0%,color-mix(in srgb,var(--cover) 82%,#4a5a8a),var(--cover) 60%,color-mix(in srgb,var(--cover) 80%,#000));
  box-shadow:inset 0 -2px 0 rgba(0,0,0,.25),0 18px 30px -22px rgba(0,0,0,.7)}
.cover::before{content:"";position:absolute;inset:16px var(--frame);border:1.5px solid color-mix(in srgb,var(--gold) 50%,transparent);border-radius:4px;pointer-events:none}
.cover .ribbon{position:absolute;z-index:3;right:14%;top:100%;width:18px;height:92px;background:linear-gradient(90deg,#7E2232,#A23446 50%,#7E2232);clip-path:polygon(0 0,100% 0,100% 100%,50% 84%,0 100%);box-shadow:0 4px 8px rgba(0,0,0,.3)}
.mode{position:absolute;z-index:6;top:calc(30px + env(safe-area-inset-top,0px));right:calc(var(--frame) + 14px);width:38px;height:38px;border-radius:50%;border:1px solid rgba(228,192,114,.4);background:none;display:grid;place-items:center;cursor:pointer;color:var(--gold)}
.mode:hover{border-color:var(--gold)}
.mode svg.i{width:17px;height:17px}
.cover h1{font:400 clamp(56px,9.4vw,140px)/1.04 var(--display);letter-spacing:-.025em;display:inline-block}
.orn{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:14px}
.orn i{width:80px;height:1.5px;background:linear-gradient(90deg,transparent,var(--gold))}
.orn i:last-child{transform:scaleX(-1)}
.orn b{width:7px;height:7px;transform:rotate(45deg);background:var(--gold)}
/* Title 1: gold foil (brighter, and no longer clipping the J) */
.t1 .cover h1{background:linear-gradient(180deg,#FBEFC4 0%,#EFD48A 38%,#C99A3E 56%,#E6C371 80%,#F6E2A6 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  padding:.02em .08em .2em;margin-bottom:-.18em;filter:drop-shadow(0 1px 0 rgba(0,0,0,.35))}
/* Title 2: cream with gold */
.t2 .cover h1{color:var(--cover-ink)}
.t2 .cover h1 em{color:var(--gold)}
/* Title 3: a label on the cover, like a journal's title plate */
.t3 .cover h1{font-size:clamp(44px,6.6vw,96px);line-height:1;background:#F3EBDA;color:#1F2740;padding:.2em .5em .22em;border-radius:4px;
  box-shadow:0 10px 24px -12px rgba(0,0,0,.7);outline:1.5px solid rgba(31,39,64,.35);outline-offset:-8px}
.t3 .cover h1 em{color:#8E6A22}
.t3 .orn{display:none}

/* ---- About me */
.intro{display:grid;grid-template-columns:180px minmax(0,1fr);gap:28px 48px;align-items:center;max-width:900px;margin:clamp(56px,6vw,80px) auto 0}
.intro .photo{aspect-ratio:1;border-radius:50%;border:2px dashed color-mix(in srgb,var(--ink) 28%,transparent);color:var(--mute);display:grid;place-content:center;justify-items:center;gap:6px;font-size:12px;font-weight:700;
  box-shadow:0 0 0 6px var(--bg),0 0 0 7.5px color-mix(in srgb,var(--acc) 60%,transparent)}
.intro .photo svg.i{width:24px;height:24px}
.intro .lab{display:block;color:var(--acc);margin-bottom:12px}
.intro p{font:400 clamp(22px,2.2vw,27px)/1.45 var(--display)}
.ph{color:var(--mute);font-style:italic}
.ph-tag{display:inline-block;font:700 10px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;padding:4px 7px;border-radius:99px;border:1px dashed var(--mute);color:var(--mute);vertical-align:middle;margin-left:8px;font-style:normal}

/* ---- Contents: the places */
.sec{display:flex;align-items:center;gap:16px;margin:clamp(56px,6vw,80px) 0 34px}
.sec .lab{color:var(--acc)}
.sec i{flex:1;height:1px;background:var(--line)}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:52px 40px}
.card{display:flex;flex-direction:column;min-width:0}
.card .kick{color:var(--acc);margin-bottom:8px}
.card h3{font:400 40px/1.05 var(--display);margin-bottom:10px}
.card p{font-size:15.5px;margin-bottom:16px}
.card p.ph{font-size:15px}
/* only these two are links: the photo and "Open …" */
.snap{position:relative;display:block;aspect-ratio:4/3;background:var(--mat);padding:12px;box-shadow:0 14px 30px -18px rgba(0,0,0,.55);margin-bottom:22px;transition:box-shadow .3s,transform .3s}
.snap:hover{box-shadow:0 20px 36px -18px rgba(0,0,0,.6);transform:translateY(-2px)}
.snap .pic{inset:12px}
.snap .c{position:absolute;z-index:2;width:24px;height:24px;background:linear-gradient(135deg,#3B3530,#1C1916);box-shadow:0 1px 2px rgba(0,0,0,.3)}
.snap .c.tl{top:5px;left:5px;clip-path:polygon(0 0,100% 0,0 100%)}
.snap .c.tr{top:5px;right:5px;clip-path:polygon(0 0,100% 0,100% 100%)}
.snap .c.bl{bottom:5px;left:5px;clip-path:polygon(0 0,0 100%,100% 100%)}
.snap .c.br{bottom:5px;right:5px;clip-path:polygon(100% 0,100% 100%,0 100%)}
.go{margin-top:auto;align-self:flex-start;display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:15px;color:var(--acc);text-decoration:none;padding:2px 0;border-bottom:1.5px solid transparent;transition:border-color .2s}
.go:hover{border-bottom-color:currentColor}
.go svg.i{transition:transform .25s}
.go:hover svg.i{transform:translateX(4px)}

/* ---- the pictures */
.pic{position:absolute;inset:0;overflow:hidden;background:#222}
.snap .pic>*{transition:transform 1s cubic-bezier(.2,.7,.2,1)}
.snap:hover .pic>*{transform:scale(1.04)}
.snap:hover .pic>.wall{transform:rotate(-8deg) scale(1.04)}
.pic>img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.pic .wall{position:absolute;inset:-34% -14%;display:grid;grid-template-columns:repeat(8,1fr);gap:6px;transform:rotate(-8deg)}
.pic .wall img{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:2px 3px 3px 2px;display:block}
.pic .grid{position:absolute;inset:0;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(2,1fr);gap:4px;background:var(--walnut);padding:4px}
.pic .grid img{width:100%;height:100%;object-fit:cover;border-radius:2px 3px 3px 2px;display:block}
.pic .fade{position:absolute;inset:0;background:var(--walnut);display:flex;align-items:center;justify-content:flex-end;gap:6px;padding:0;overflow:hidden}
.pic .fade img{height:66%;aspect-ratio:2/3;object-fit:cover;border-radius:2px 4px 4px 2px;box-shadow:0 8px 16px -6px rgba(0,0,0,.6);flex:none}
.pic .fade::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--walnut) 0%,rgba(59,38,22,.55) 22%,rgba(59,38,22,0) 48%)}
.pic .mon{position:absolute;width:20%;max-width:96px;right:9%;top:13%;filter:drop-shadow(0 8px 12px rgba(0,0,0,.45))}
.pic .mon.two{width:15%;max-width:72px;right:calc(9% + min(21%,100px));top:22%}
.pic .mon.front{width:44%;max-width:180px;right:6%;top:auto;bottom:4%}
.pic.blank{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--pc) 88%,#fff) 0 14px,var(--pc) 14px 28px)}

.foot{margin-top:clamp(72px,8vw,110px);border-top:1px solid var(--line)}
.foot .wrap{display:flex;justify-content:space-between;align-items:baseline;gap:8px 24px;flex-wrap:wrap;padding-block:26px 150px;font-size:12px;color:var(--mute)}
.foot b{font:400 20px/1 var(--display);color:var(--ink)}
.credits span+span::before{content:" · "}

/* ---- the trial switch (bottom right; not part of the site) */
.sw{position:fixed;z-index:50;right:calc(14px + env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));display:grid;gap:4px;padding:8px;border-radius:16px;
  background:var(--sw-bg);color:var(--sw-ink);border:1px solid var(--sw-line);box-shadow:0 10px 30px -8px rgba(0,0,0,.35);font-size:13px}
.sw .row{display:flex;align-items:center;gap:3px}
.sw .lab{width:66px;color:var(--sw-mute);font-size:10px;padding-left:4px}
.sw button{border:0;background:none;min-width:32px;padding:5px 9px;border-radius:99px;font-size:13px;font-weight:700;cursor:pointer;color:var(--sw-ink)}
.sw button:hover{background:color-mix(in srgb,var(--sw-ink) 8%,transparent)}
.sw button[aria-pressed="true"]{background:var(--sw-on);color:var(--sw-on-ink)}
.sw #more{width:100%;text-align:left;padding-left:8px}
.sw #more[aria-pressed="true"]{background:color-mix(in srgb,var(--sw-ink) 12%,transparent);color:var(--sw-ink)}
.toast{position:fixed;z-index:60;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--sw-on);color:var(--sw-on-ink);padding:10px 18px;border-radius:99px;font-size:13.5px;font-weight:700;box-shadow:0 10px 30px -8px rgba(0,0,0,.4);white-space:nowrap}

@media (prefers-reduced-motion: reduce){*{transition:none!important}}

@media (max-width:900px){ .cards{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:760px){
  body{font-size:15.5px}
  .cover{padding-block:62px 44px}
  .cover .ribbon{right:12%;height:60px;width:14px}
  .mode{top:calc(26px + env(safe-area-inset-top,0px))}
  .orn i{width:50px}
  .t3 .cover h1{font-size:40px;padding:.22em .45em .24em;outline-offset:-6px}
  .intro{grid-template-columns:96px minmax(0,1fr);gap:18px 20px;align-items:start}
  .intro .photo{font-size:10px;box-shadow:0 0 0 4px var(--bg),0 0 0 5.5px color-mix(in srgb,var(--acc) 60%,transparent)}
  .intro .photo svg.i{width:18px;height:18px}
  .intro p{font-size:20px}
  .cards{grid-template-columns:1fr;gap:44px}
  .card h3{font-size:36px}
  .pic .mon{width:18%}
  .pic .mon.two{width:13%;right:calc(9% + 19%)}
  .sw .lab{width:auto;padding-right:2px}
}
</style>

<div id="page"></div>

<div class="sw" role="group" aria-label="Choices to try">
  <div class="row"><span class="lab">Pictures</span><button type="button" data-k="p" data-v="1">1</button><button type="button" data-k="p" data-v="2">2</button><button type="button" data-k="p" data-v="3">3</button></div>
  <div class="row"><span class="lab">Names</span><button type="button" data-k="n" data-v="1">1</button><button type="button" data-k="n" data-v="2">2</button><button type="button" data-k="n" data-v="3">3</button></div>
  <div class="row"><span class="lab">Title</span><button type="button" data-k="t" data-v="1">1</button><button type="button" data-k="t" data-v="2">2</button><button type="button" data-k="t" data-v="3">3</button></div>
  <div class="row"><button type="button" id="more" aria-pressed="false">+ More places</button></div>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(function(){
  // The places. A new one is one more line here.
  // "about" is a line from that app's own home page; null means a space for her words.
  // pics: the three picture choices (Pictures 1, 2, 3) for that place.
  var PLACES=[
    {name:"Sim World", full:"Jemma’s Sim World", kind:"The Sims 4", pc:"#4E3182",
     about:"Every world in the game, rebuilt one lot at a time. Wander the neighbourhoods, look around the homes and venues, and meet the households who live in them.",
     pics:[{img:"img/map-windenburg.jpg"},{img:"img/shot-cottage-am-see.jpg"},{img:"img/shot-hanamigawa-koen.jpg"}]},
    {name:"Library", full:"Jemma’s Library", kind:"Books", pc:"#6E4524",
     about:"Every book on the shelves at home, and everything you read.",
     pics:[{wall:true},{grid:true},{fade:true}]},
    {name:"Pokédex", full:"Jemma’s Pokédex", kind:"Pokémon GO", pc:"#7E2530",
     about:null,
     pics:[{img:"img/region-kanto.jpg",mons:["img/mon/pm25.webp","img/mon/pm133.webp"]},{img:"img/bg-go-fest-2023-london.jpg",front:"img/mon/pm384.webp"},{img:"img/bg-go-fest-2026-copenhagen.jpg",front:"img/mon/pm150.webp"}]}
  ];
  // Only for "More places": stand-ins to show how it grows. Not real places.
  var EXTRA=[{name:"New place",full:"New place",kind:"Next",pc:"#35606F",demo:true},{name:"New place",full:"New place",kind:"Next",pc:"#8A6A3A",demo:true},{name:"New place",full:"New place",kind:"Next",pc:"#5A5F73",demo:true}];
  var ROMAN=["I","II","III","IV","V","VI","VII","VIII","IX","X"];
  var ICON={
    "arrow-right":'<path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>',
    "image":'<rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/>',
    "sun":'<circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/>',
    "moon":'<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>'
  };
  function ico(n){ return '<svg class="i" viewBox="0 0 24 24" aria-hidden="true">'+ICON[n]+'</svg>'; }
  function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
  function cover(n){ return '<img src="img/wall/'+String(n%40).padStart(2,'0')+'.jpg" alt="">'; }
  var WALL=''; for(var n=0;n<72;n++) WALL+=cover((n*7)%40);
  var GRID=[3,8,12,17,22,26,31,35].map(cover).join('');
  var FADE=[5,14,19,28,33,38,9,24].map(cover).join('');
  function pic(p){
    if(p.demo) return '<span class="pic blank" style="--pc:'+p.pc+'"></span>';
    var q=p.pics[S.p-1], h='<span class="pic">';
    if(q.wall) h+='<span class="wall">'+WALL+'</span>';
    if(q.grid) h+='<span class="grid">'+GRID+'</span>';
    if(q.fade) h+='<span class="fade">'+FADE+'</span>';
    if(q.img) h+='<img class="bg" src="'+q.img+'" alt="">';
    (q.mons||[]).forEach(function(m,i){ h+='<img class="mon'+(i?' two':'')+'" src="'+m+'" alt="">'; });
    if(q.front) h+='<img class="mon front" src="'+q.front+'" alt="">';
    return h+'</span>';
  }
  function aboutPlace(p){ return p.about ? '<p>'+esc(p.about)+'</p>' : '<p class="ph">A line or two about '+(p.demo?'it':esc(p.name))+', in your own words.</p>'; }

  // state: p pictures, n names, t title (1–3); more places; light/dark
  var S={p:1,n:1,t:1}, more=false, root=document.documentElement, userMode=null;
  try{ userMode=localStorage.getItem('jj-mode'); var saved=JSON.parse(localStorage.getItem('jj-s7')||'null'); if(saved) S=saved; }catch(e){}
  location.hash.slice(1).split('-').forEach(function(w){ var m=/^([pnt])([123])$/.exec(w); if(m) S[m[1]]=+m[2]; if(w==='more') more=true; if(w==='dark'||w==='light') userMode=w; });
  var mq=window.matchMedia ? matchMedia('(prefers-color-scheme: dark)') : null;
  function sysMode(){ var t=root.getAttribute('data-theme'); if(t==='dark'||t==='light') return t; return mq&&mq.matches ? 'dark':'light'; }
  function applyMode(){ root.setAttribute('data-mode', userMode||sysMode()); }
  applyMode();
  if(mq && mq.addEventListener) mq.addEventListener('change',function(){ if(!userMode){ applyMode(); render(); } });

  function render(){
    var list=more ? PLACES.concat(EXTRA) : PLACES, dark=root.getAttribute('data-mode')==='dark';
    var page=document.getElementById('page'); page.className='t'+S.t;
    var h='<header class="cover gut"><button type="button" class="mode" data-mode-btn aria-label="'+(dark?'Light':'Dark')+' mode">'+ico(dark?'sun':'moon')+'</button>'
      +'<div class="wrap"><h1>Jemma’s <em>Journals</em></h1><div class="orn"><i></i><b></b><i></i></div></div><span class="ribbon"></span></header>'
      +'<main class="gut"><div class="wrap">'
      +'<section class="intro"><span class="photo">'+ico('image')+'Your photo</span><div><span class="lab">About me</span>'
      +'<p class="ph">Your introduction goes here, in your own words: a few sentences about you, what you keep in these journals, anything you’d like people to know.<span class="ph-tag">Placeholder</span></p></div></section>'
      +'<div class="sec"><span class="lab">Contents</span><i></i></div><div class="cards">';
    list.forEach(function(p,i){
      var name = S.n===2 ? p.full : p.name, open=p.demo?'it':p.name;
      h+='<article class="card" style="--pc:'+p.pc+'">'
        +'<a class="snap" href="#" data-open="'+esc(p.demo?'':p.name)+'" aria-label="Open '+esc(open)+'"><span class="c tl"></span><span class="c tr"></span><span class="c bl"></span><span class="c br"></span>'+pic(p)+'</a>'
        +(S.n===1 ? '<span class="kick lab">'+ROMAN[i]+' · '+esc(p.kind)+'</span>' : '')
        +'<h3>'+esc(name)+'</h3>'+aboutPlace(p)
        +'<a class="go" href="#" data-open="'+esc(p.demo?'':p.name)+'">Open '+esc(open)+' '+ico('arrow-right')+'</a></article>';
    });
    h+='</div></div></main><footer class="foot gut"><div class="wrap"><b>Jemma’s Journals</b><p class="credits"><span>World maps by 20th Century Plumbob</span><span>Sims screenshots by Jemma</span><span>Pokémon pictures, backgrounds and region map from the games</span><span>Covers from the publishers</span><span>Icons by Lucide</span></p></div></footer>';
    page.innerHTML=h;
    document.querySelectorAll('.sw [data-k]').forEach(function(b){ b.setAttribute('aria-pressed', S[b.dataset.k]===+b.dataset.v ? 'true':'false'); });
    document.getElementById('more').setAttribute('aria-pressed', more?'true':'false');
    try{ localStorage.setItem('jj-s7',JSON.stringify(S)); }catch(e){}
  }
  render();

  var toast=document.getElementById('toast'), t;
  function say(m){ toast.textContent=m; toast.hidden=false; clearTimeout(t); t=setTimeout(function(){ toast.hidden=true; },1800); }
  document.addEventListener('click',function(e){
    var b=e.target.closest('.sw [data-k]'); if(b){ S[b.dataset.k]=+b.dataset.v; render(); return; }
    if(e.target.closest('#more')){ more=!more; render(); return; }
    if(e.target.closest('[data-mode-btn]')){
      userMode = root.getAttribute('data-mode')==='dark' ? 'light' : 'dark';
      try{ localStorage.setItem('jj-mode',userMode); }catch(err){}
      applyMode(); render(); return;
    }
    var a=e.target.closest('a[data-open]'); if(!a) return;
    e.preventDefault();
    say(a.dataset.open ? 'This would open your '+a.dataset.open : 'A new place would go here');
  });
})();
</script>
