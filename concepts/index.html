<title>Jemma’s Journals</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Jemma's Journals: home page, round 6 (19 Nov 2026). Her pick: M (Magazine) with the Cloth cover (black stripe taken off), the places shown as F's journal covers
   (switch: covers with name plate / without / photos in album corners). Round 5's Lined and Dotted versions are still in the code below but not on the switch.
   Round 5 notes: M with the journal feel she liked before, in three versions:
   Lined (the exercise-book page and taped photos of E) · Cloth (a cloth journal cover with gold lettering, photos in album corners, from F and A) · Dotted (a dot-grid journal page with washi tape).
   A website first: masthead, About me, Contents of the places (picture, heading, a line, a link), footer, light/dark. Places come from one list (PLACES).
   Fonts: Instrument Serif + Manrope (local, SIL OFL). Icons: Lucide (ISC). */
@font-face{font-family:"Instrument Serif";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/instrument-serif-latin.woff2) format("woff2")}
@font-face{font-family:"Instrument Serif";font-style:italic;font-weight:400;font-display:swap;src:url(fonts/instrument-serif-italic-latin.woff2) format("woff2")}
@font-face{font-family:"Manrope";font-style:normal;font-weight:200 800;font-display:swap;src:url(fonts/manrope-latin.woff2) format("woff2")}

:root{
  --display:"Instrument Serif","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --body:"Manrope","Segoe UI",system-ui,sans-serif;
  --g:clamp(16px,4vw,56px);
  --foil-1:#F6E3A8; --foil-2:#D7B05A; --foil-3:#A47A2C;
  --sw-bg:#FFFFFF; --sw-ink:#1A1F2C; --sw-mute:#6B7280; --sw-line:#E1E4EA; --sw-on:#1A1F2C; --sw-on-ink:#FFFFFF;
  --page:#F6F8FB;
}
:root[data-mode="dark"]{ --sw-bg:#1E2330; --sw-ink:#ECEEF3; --sw-mute:#9AA1B2; --sw-line:#30364A; --sw-on:#ECEEF3; --sw-on-ink:#151923; color-scheme:dark }

*{box-sizing:border-box}
html{background:var(--page)}
body{margin:0;background:var(--page);font:400 16px/1.65 var(--body);-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit}
img{max-width:100%}
h1,h2,h3,p{margin:0;font-weight:400}
svg.i{width:1em;height:1em;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:2px solid currentColor;outline-offset:3px;border-radius:6px}
.gut{padding-left:max(var(--g),env(safe-area-inset-left,0px));padding-right:max(var(--g),env(safe-area-inset-right,0px))}
.lab{font:700 11px/1.2 var(--body);letter-spacing:.16em;text-transform:uppercase}
.wrap{max-width:1160px;margin:0 auto}
#page{position:relative;min-height:100vh;color:var(--ink)}

/* ---- shared */
.mode{position:absolute;z-index:6;top:calc(20px + env(safe-area-inset-top,0px));right:max(var(--g),env(safe-area-inset-right,0px));width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:none;display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.mode:hover{border-color:currentColor}
.mode svg.i{width:18px;height:18px}
.ph{color:var(--mute);font-style:italic}
.ph-tag{display:inline-block;font:700 10px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;padding:4px 7px;border-radius:99px;border:1px dashed var(--mute);color:var(--mute);vertical-align:middle;margin-left:8px;font-style:normal}
.photo{border:2px dashed color-mix(in srgb,var(--ink) 28%,transparent);color:var(--mute);display:grid;place-content:center;justify-items:center;gap:6px;font-size:12px;font-weight:700;text-align:center;font-style:normal}
.photo svg.i{width:24px;height:24px}
.go{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:15px;color:var(--acc)}
.go svg.i{transition:transform .25s}
.card:hover .go svg.i{transform:translateX(4px)}
.pic{position:absolute;inset:0;overflow:hidden;background:#222}
.pic>img.bg{width:100%;height:100%;object-fit:cover;display:block}
.pic .wall{position:absolute;inset:-34% -14%;display:grid;grid-template-columns:repeat(8,1fr);gap:6px;transform:rotate(-8deg)}
.pic .wall img{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:2px 3px 3px 2px;display:block}
.pic .mon{position:absolute;width:20%;max-width:96px;right:9%;top:13%;filter:drop-shadow(0 8px 12px rgba(0,0,0,.45))}
.pic .mon.two{width:15%;max-width:72px;right:calc(9% + min(21%,100px));top:22%}
.pic.blank{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--pc) 88%,#fff) 0 14px,var(--pc) 14px 28px)}

/* layout (M): masthead, intro beside the photo, contents as cards */
.mast{text-align:center;position:relative}
.mast h1{font:400 clamp(58px,10vw,148px)/.9 var(--display);letter-spacing:-.025em}
.mast h1 em{color:var(--acc)}
.intro{display:grid;grid-template-columns:200px minmax(0,1fr);gap:28px 52px;align-items:center}
.intro .lab{display:block;color:var(--acc)}
.intro p{font:400 clamp(22px,2.2vw,28px)/1.45 var(--display);max-width:42ch}
.sec{display:flex;align-items:center;gap:16px}
.sec .lab{color:var(--acc)}
.sec i{flex:1;height:1px;background:var(--line)}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:48px 40px}
.card{display:grid;align-content:start;text-decoration:none;min-width:0}
.card .kick{color:var(--acc)}
.card h3{font:400 40px/1.05 var(--display)}
.card p{font-size:15.5px}
.card:hover h3{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:7px;text-decoration-color:var(--acc)}
.snap{position:relative;display:block}
.snap .pic{transition:transform 1s cubic-bezier(.2,.7,.2,1)}
.card:hover .snap .pic{transform:scale(1.04)}
.tape{position:absolute;z-index:2;top:-13px;left:50%;width:38%;height:26px;transform:translateX(-50%) rotate(-3deg);background:rgba(244,236,214,.82);box-shadow:0 1px 2px rgba(0,0,0,.14)}
.foot .wrap{display:flex;justify-content:space-between;align-items:baseline;gap:8px 24px;flex-wrap:wrap;font-size:12px;color:var(--mute)}
.foot b{font:400 20px/1 var(--display);color:var(--ink)}
.credits span+span::before{content:" · "}

/* ================================================================ Lined: the ruled exercise-book page */
.v-lined{--bg:#F6F8FB;--rule:#D6DFEB;--margin:#E2A1AC;--ink:#1C2742;--mute:#6A7690;--line:#C3CEDF;--acc:#B94F64;--polar:#FDFBF7;--m:clamp(30px,6vw,104px);
  background:var(--bg) repeating-linear-gradient(180deg,transparent 0 33px,var(--rule) 33px 34px)}
[data-mode="dark"] .v-lined{--bg:#141B2C;--rule:#222C44;--margin:#7A3D4A;--ink:#EDE7DB;--mute:#9AA3BA;--line:#36415C;--acc:#EC93A3;--polar:#ECE7DD}
.v-lined::before{content:"";position:absolute;top:0;bottom:0;left:calc(var(--m) - 16px);width:4px;border-left:1px solid var(--margin);border-right:1px solid var(--margin);pointer-events:none}
.v-lined .gut{padding-left:max(calc(var(--m) + 8px),env(safe-area-inset-left,0px))}
.v-lined .mast{padding-top:102px}
.v-lined .mast h1{line-height:136px}
.v-lined .intro{margin-top:68px;align-items:start}
.v-lined .intro .lab{line-height:34px}
.v-lined .intro p{line-height:34px;font-size:clamp(21px,2vw,25px)}
.v-lined .polar{background:var(--polar);padding:9px 9px 30px;transform:rotate(-3deg);box-shadow:0 14px 30px -14px rgba(10,20,50,.5);position:relative;margin-top:8px}
.v-lined .polar .photo{aspect-ratio:1;border-color:#C5CBD8;color:#7A8296}
.v-lined .sec{margin-top:68px;height:34px}
.v-lined .cards{margin-top:34px;row-gap:68px}
.v-lined .snap{height:272px;background:var(--polar);padding:10px 10px 36px;box-shadow:0 18px 36px -18px rgba(10,20,50,.5);transform:rotate(var(--r,0deg));margin:0 8px 34px}
.v-lined .snap .pic{inset:10px 10px 36px}
.v-lined .card .kick{line-height:34px}
.v-lined .card h3{line-height:68px;font-size:44px}
.v-lined .card p{line-height:34px;font-size:15.5px}
.v-lined .card .go{line-height:34px;margin-top:0}
.v-lined .foot{margin-top:102px}
.v-lined .foot .wrap{line-height:34px;padding-block:0 136px}

/* ================================================================ Cloth: a cloth journal cover with gold lettering, album photo corners */
.v-cloth{--bg:#F4EEE3;--ink:#221D17;--mute:#776D60;--line:#DDD3C3;--acc:#8E6A22;--cover:#1C2540;--mat:#FFFDF8}
[data-mode="dark"] .v-cloth{--bg:#15130F;--ink:#EFE9DE;--mute:#A89F91;--line:#2F2A23;--acc:#DDB86A;--cover:#121A30;--mat:#EDE6D8}
.v-cloth{background:var(--bg)}
.v-cloth .cover{position:relative;color:var(--foil-2);padding-block:clamp(70px,8vw,104px) clamp(56px,6vw,84px);
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.03) 0 1px,transparent 1px 3px),repeating-linear-gradient(90deg,rgba(0,0,0,.06) 0 1px,transparent 1px 3px),
    radial-gradient(110% 120% at 30% 0%,color-mix(in srgb,var(--cover) 80%,#4a5a8a),var(--cover) 60%,color-mix(in srgb,var(--cover) 80%,#000));
  box-shadow:inset 0 -2px 0 rgba(0,0,0,.25),0 18px 30px -22px rgba(0,0,0,.7)}
.v-cloth .cover::before{content:"";position:absolute;inset:16px max(calc(var(--g) - 20px),12px);border:1.5px solid color-mix(in srgb,var(--foil-2) 55%,transparent);border-radius:4px;pointer-events:none}
.v-cloth .cover .ribbon{position:absolute;z-index:3;right:14%;top:100%;width:18px;height:96px;background:linear-gradient(90deg,#7E2232,#A23446 50%,#7E2232);clip-path:polygon(0 0,100% 0,100% 100%,50% 84%,0 100%);box-shadow:0 4px 8px rgba(0,0,0,.3)}
.v-cloth .mode{color:var(--foil-1);border-color:rgba(246,227,168,.35)}
.v-cloth .mast h1,.v-cloth .mast h1 em{background:linear-gradient(170deg,var(--foil-1),var(--foil-2) 45%,var(--foil-3) 75%,var(--foil-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.v-cloth .orn{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:20px;color:var(--foil-2)}
.v-cloth .orn i{width:80px;height:1.5px;background:linear-gradient(90deg,transparent,var(--foil-2))}
.v-cloth .orn i:last-child{transform:scaleX(-1)}
.v-cloth .orn b{width:7px;height:7px;transform:rotate(45deg);background:var(--foil-2)}
.v-cloth .intro{margin-top:clamp(56px,6vw,80px)}
.v-cloth .intro .photo{aspect-ratio:1;border-radius:50%;box-shadow:0 0 0 6px var(--bg),0 0 0 7.5px color-mix(in srgb,var(--acc) 60%,transparent)}
.v-cloth .intro .lab{margin-bottom:12px}
.v-cloth .sec{margin:clamp(56px,6vw,80px) 0 34px}
.v-cloth .snap{aspect-ratio:4/3;background:var(--mat);padding:12px;box-shadow:0 14px 30px -18px rgba(0,0,0,.55);margin-bottom:22px}
.v-cloth .snap .pic{inset:12px}
.v-cloth .snap .c{position:absolute;z-index:2;width:30px;height:30px;background:linear-gradient(135deg,#3B3530,#1C1916);box-shadow:0 1px 2px rgba(0,0,0,.3)}
.v-cloth .snap .c.tl{top:4px;left:4px;clip-path:polygon(0 0,100% 0,0 100%)}
.v-cloth .snap .c.tr{top:4px;right:4px;clip-path:polygon(0 0,100% 0,100% 100%)}
.v-cloth .snap .c.bl{bottom:4px;left:4px;clip-path:polygon(0 0,0 100%,100% 100%)}
.v-cloth .snap .c.br{bottom:4px;right:4px;clip-path:polygon(100% 0,100% 100%,0 100%)}
/* the places as journal covers (from F): the picture is the cover, cloth spine, brass corners, pages behind; it swings open on hover */
.v-cloth{--brass:#C9A253}
.jcov{position:relative;display:block;aspect-ratio:3/4;margin:0 0 24px;max-width:330px;perspective:1600px}
.jcov .pages{position:absolute;inset:7px 0 7px 6px;border-radius:0 10px 10px 0;background:repeating-linear-gradient(90deg,#F4EFE3 0 2px,#DDD6C5 2px 3px);box-shadow:0 22px 40px -22px rgba(0,0,0,.6)}
.jcov .cv{position:absolute;inset:0;border-radius:4px 12px 12px 4px;overflow:hidden;transform-origin:left center;transition:transform .7s cubic-bezier(.2,.7,.2,1),box-shadow .7s;box-shadow:0 2px 3px rgba(0,0,0,.25),0 24px 44px -22px rgba(0,0,0,.7)}
.card:hover .jcov .cv{transform:rotateY(-24deg);box-shadow:0 2px 3px rgba(0,0,0,.2),24px 30px 50px -26px rgba(0,0,0,.6)}
.jcov .cv .pic::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.04),rgba(0,0,0,.16) 60%,rgba(0,0,0,.38));pointer-events:none}
.jcov .spine{position:absolute;left:0;top:0;bottom:0;width:10%;background:linear-gradient(90deg,color-mix(in srgb,var(--pc) 70%,#000),var(--pc) 70%,color-mix(in srgb,var(--pc) 80%,#fff));box-shadow:2px 0 0 rgba(0,0,0,.25)}
.jcov .spine::after{content:"";position:absolute;top:10px;bottom:10px;right:5px;border-right:1.5px dashed rgba(255,255,255,.35)}
.jcov .corner{position:absolute;right:0;width:15%;aspect-ratio:1;background:linear-gradient(135deg,#F1D998,var(--brass) 45%,#8C6A2B)}
.jcov .corner.t{top:0;clip-path:polygon(0 0,100% 0,100% 100%)}
.jcov .corner.b{bottom:0;clip-path:polygon(100% 0,100% 100%,0 100%)}
.jcov .plate{position:absolute;left:19%;right:9%;bottom:11%;display:flex;align-items:center;justify-content:center;gap:10px;background:#F5F0E4;color:#2A2419;border-radius:4px;padding:12px 10px 11px;
  outline:1px solid rgba(42,36,25,.3);outline-offset:-5px;box-shadow:0 6px 14px -6px rgba(0,0,0,.6)}
.jcov .plate b{font:400 clamp(22px,2.2vw,30px)/1 var(--display);white-space:nowrap}
.jcov .plate img,.jcov .plate .bm{width:26px;height:26px;border-radius:7px;flex:none}
.jcov .plate .bm{display:grid;place-items:center;background:var(--pc);color:#fff;font:400 16px/1 var(--display)}
.v-cloth .card .kick{margin-bottom:8px}
.v-cloth .card h3{margin-bottom:10px}
.v-cloth .card p{margin-bottom:14px}
.v-cloth .foot{margin-top:clamp(72px,8vw,110px);border-top:1px solid var(--line)}
.v-cloth .foot .wrap{padding-block:26px 120px}

/* ================================================================ Dotted: a dot-grid journal page, washi tape, a highlighter */
.v-dotted{--bg:#F8F5EE;--dot:#CFC7B8;--ink:#24201B;--mute:#7A7166;--line:#DED6C8;--acc:#A65A1E;--hl:#F6D86B;--mat:#FFFDF8;
  background:var(--bg) radial-gradient(circle,var(--dot) 1.15px,transparent 1.5px) 0 0/24px 24px}
[data-mode="dark"] .v-dotted{--bg:#17150F;--dot:#3A352C;--ink:#EEE8DC;--mute:#A69D8F;--line:#302B23;--acc:#E7A35F;--hl:rgba(230,190,70,.42);--mat:#EDE6D8}
.v-dotted .mast{padding-top:clamp(64px,8vw,104px)}
.v-dotted .mast h1 em{color:var(--ink);background:linear-gradient(176deg,transparent 52%,var(--hl) 52%,var(--hl) 86%,transparent 86%);padding:0 .08em}
.v-dotted .mast .tape{top:clamp(40px,5vw,70px);left:calc(50% - min(30vw,420px));width:120px;transform:rotate(-14deg);background:repeating-linear-gradient(45deg,rgba(201,90,110,.45) 0 7px,rgba(201,90,110,.25) 7px 14px)}
.v-dotted .mast .tape.r{left:auto;right:calc(50% - min(30vw,420px));transform:rotate(12deg);background:repeating-linear-gradient(-45deg,rgba(76,110,170,.42) 0 7px,rgba(76,110,170,.22) 7px 14px)}
.v-dotted .intro{margin-top:clamp(52px,6vw,76px)}
.v-dotted .intro .photo{aspect-ratio:1;border-radius:6px;background:var(--mat);transform:rotate(2deg);box-shadow:0 12px 26px -16px rgba(0,0,0,.5)}
.v-dotted .intro .wrapphoto{position:relative}
.v-dotted .intro .lab{margin-bottom:12px}
.v-dotted .sec{margin:clamp(52px,6vw,76px) 0 36px}
.v-dotted .snap{aspect-ratio:4/3;background:var(--mat);padding:10px;box-shadow:0 14px 30px -18px rgba(0,0,0,.5);transform:rotate(var(--r,0deg));margin:0 6px 26px}
.v-dotted .snap .pic{inset:10px}
.v-dotted .snap .tape{width:46%;background:repeating-linear-gradient(45deg,color-mix(in srgb,var(--pc) 55%,rgba(255,255,255,.4)) 0 7px,color-mix(in srgb,var(--pc) 30%,rgba(255,255,255,.55)) 7px 14px);opacity:.85}
.v-dotted .card .kick{margin-bottom:8px}
.v-dotted .card h3{margin-bottom:10px;align-self:start;justify-self:start}
.v-dotted .card p{margin-bottom:14px}
.v-dotted .foot{margin-top:clamp(72px,8vw,110px);border-top:1.5px dashed var(--line)}
.v-dotted .foot .wrap{padding-block:26px 120px}

/* ================================================================ switch + toast */
.sw{position:fixed;z-index:50;right:calc(14px + env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:3px;padding:5px;border-radius:99px;
  background:var(--sw-bg);color:var(--sw-ink);border:1px solid var(--sw-line);box-shadow:0 10px 30px -8px rgba(0,0,0,.35);max-width:calc(100vw - 28px)}
.sw .lab{padding:0 8px 0 10px;color:var(--sw-mute);font-size:10.5px}
.sw button{border:0;background:none;padding:7px 12px;border-radius:99px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;color:var(--sw-ink)}
.sw button:hover{background:color-mix(in srgb,var(--sw-ink) 8%,transparent)}
.sw button[aria-pressed="true"]{background:var(--sw-on);color:var(--sw-on-ink)}
.sw .sep{width:1px;height:22px;background:var(--sw-line);margin:0 4px}
.sw #more[aria-pressed="true"]{background:color-mix(in srgb,var(--sw-ink) 12%,transparent);color:var(--sw-ink)}
.toast{position:fixed;z-index:60;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--sw-on);color:var(--sw-on-ink);padding:10px 18px;border-radius:99px;font-size:13.5px;font-weight:700;box-shadow:0 10px 30px -8px rgba(0,0,0,.4);white-space:nowrap}

@media (prefers-reduced-motion: reduce){*{transition:none!important}}

@media (max-width:900px){
  .cards{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:760px){
  body{font-size:15.5px}
  .mode{width:38px;height:38px}
  .intro{grid-template-columns:96px minmax(0,1fr);gap:18px 20px;align-items:start}
  .intro p{font-size:20px}
  .photo{font-size:10px}
  .photo svg.i{width:18px;height:18px}
  .cards{grid-template-columns:1fr;gap:40px}
  .card h3{font-size:36px}
  .pic .mon{width:18%}
  .pic .mon.two{width:13%;right:calc(9% + 19%)}
  /* lined */
  .v-lined{--m:30px}
  .v-lined .mast{padding-top:68px}
  .v-lined .mast h1{font-size:56px;line-height:68px}
  .v-lined .intro{margin-top:34px}
  .v-lined .intro p{font-size:19px}
  .v-lined .polar{padding:6px 6px 20px}
  .v-lined .sec{margin-top:34px}
  .v-lined .cards{row-gap:34px}
  .v-lined .snap{height:238px}
  .v-lined .card h3{font-size:38px}
  /* cloth */
  .v-cloth .cover{padding-block:72px 50px}
  .v-cloth .cover .ribbon{right:12%;height:60px;width:14px}
  /* journal covers on a phone: a small cover beside its words, like a book list */
  .cards.jcovers{gap:30px}
  .cards.jcovers .card{grid-template-columns:118px minmax(0,1fr);column-gap:18px;align-items:start}
  .cards.jcovers .card>.jcov{grid-row:1 / span 4;margin-bottom:0}
  .cards.jcovers .card h3{font-size:32px}
  .cards.jcovers .card p{font-size:14.5px;line-height:1.55}
  .jcov .plate{left:16%;right:7%;padding:6px 4px 5px;gap:5px;bottom:10%}
  .jcov .plate b{font-size:14px}
  .jcov .plate img,.jcov .plate .bm{width:13px;height:13px;border-radius:4px}
  .jcov:hover .cv,.card:hover .jcov .cv{transform:none}
  .v-cloth .orn i{width:50px}
  /* dotted */
  .v-dotted .mast .tape{left:-6px;width:80px;top:52px}
  .v-dotted .mast .tape.r{right:-6px;left:auto}
  .sw .lab,.sw button .long{display:none}
  .sw button .short{display:inline}
}
.sw button .short{display:none}
</style>

<div id="page"></div>

<div class="sw" role="group" aria-label="Versions">
  <span class="lab">Places</span>
  <button type="button" data-c="plate"><span class="long">Covers with name plate</span><span class="short">Plate</span></button>
  <button type="button" data-c="noplate"><span class="long">Covers without</span><span class="short">No plate</span></button>
  <button type="button" data-c="corners"><span class="long">Photos in corners</span><span class="short">Photos</span></button>
  <i class="sep"></i>
  <button type="button" id="more" aria-pressed="false">+<span class="long"> More places</span></button>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(function(){
  // The places. A new one is one more line here.
  // "about" is a line from that app's own home page; null means a space for her words.
  var PLACES=[
    {name:"Sim World", kind:"The Sims 4", pc:"#4E3182", icon:"img/icons/sims.png", pic:{img:"img/map-windenburg.jpg"},
     about:"Every world in the game, rebuilt one lot at a time. Wander the neighbourhoods, look around the homes and venues, and meet the households who live in them."},
    {name:"Library", kind:"Books", pc:"#6E4524", icon:"img/icons/library.png", pic:{wall:true},
     about:"Every book on the shelves at home, and everything you read."},
    {name:"Pokédex", kind:"Pokémon GO", pc:"#7E2530", icon:"img/icons/pokedex.png", pic:{img:"img/region-kanto.jpg", mons:["img/mon/pm25.webp","img/mon/pm133.webp"]},
     about:null}
  ];
  // Only for "More places": stand-ins to show how it grows. Not real places.
  var EXTRA=[{name:"New place",kind:"Next",pc:"#35606F",demo:true,about:null},{name:"New place",kind:"Next",pc:"#8A6A3A",demo:true,about:null},{name:"New place",kind:"Next",pc:"#5A5F73",demo:true,about:null}];
  var ROMAN=["I","II","III","IV","V","VI","VII","VIII","IX","X"], TILT=[-2.2,1.6,-1.2,2,-1.6,1.2];
  var ICON={
    "arrow-right":'<path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>',
    "image":'<rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/>',
    "sun":'<circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/>',
    "moon":'<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>'
  };
  function ico(n){ return '<svg class="i" viewBox="0 0 24 24" aria-hidden="true">'+ICON[n]+'</svg>'; }
  function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
  var wallHTML=''; for(var n=0;n<72;n++) wallHTML+='<img src="img/wall/'+String((n*7)%40).padStart(2,'0')+'.jpg" alt="">';
  function pic(p){
    if(p.demo) return '<span class="pic blank" style="--pc:'+p.pc+'"></span>';
    var h='<span class="pic">';
    if(p.pic.wall) h+='<span class="wall">'+wallHTML+'</span>';
    if(p.pic.img) h+='<img class="bg" src="'+p.pic.img+'" alt="">';
    (p.pic.mons||[]).forEach(function(m,i){ h+='<img class="mon'+(i?' two':'')+'" src="'+m+'" alt="">'; });
    return h+'</span>';
  }
  function aboutPlace(p){ return p.about ? '<p>'+esc(p.about)+'</p>' : '<p class="ph">A line or two about '+(p.demo?'it':esc(p.name))+', in your own words.</p>'; }
  var INTRO='<p class="ph">Your introduction goes here, in your own words: a few sentences about you, what you keep in these journals, anything you’d like people to know.<span class="ph-tag">Placeholder</span></p>';
  function photo(){ return '<span class="photo">'+ico('image')+'Your photo</span>'; }

  var root=document.documentElement, userMode=null, v='cloth', cov='plate', more=false;
  try{ userMode=localStorage.getItem('jj-mode'); cov=localStorage.getItem('jj-c6')||cov; }catch(e){}
  var mq=window.matchMedia ? matchMedia('(prefers-color-scheme: dark)') : null;
  function sysMode(){ var t=root.getAttribute('data-theme'); if(t==='dark'||t==='light') return t; return mq&&mq.matches ? 'dark':'light'; }
  function applyMode(){ root.setAttribute('data-mode', userMode||sysMode()); }
  location.hash.slice(1).split('-').forEach(function(w){ if(w==='plate'||w==='noplate'||w==='corners') cov=w; if(w==='more') more=true; if(w==='dark'||w==='light') userMode=w; });
  applyMode();
  if(mq && mq.addEventListener) mq.addEventListener('change',function(){ if(!userMode){ applyMode(); render(); } });

  function snap(p,i){
    if(v==='cloth' && cov!=='corners'){
      var plate = cov==='plate' ? '<span class="plate">'+(p.icon?'<img src="'+p.icon+'" alt="">':'<span class="bm">+</span>')+'<b>'+esc(p.name)+'</b></span>' : '';
      return '<span class="jcov" style="--pc:'+p.pc+'"><span class="pages"></span><span class="cv">'+pic(p)+'<span class="spine"></span><span class="corner t"></span><span class="corner b"></span>'+plate+'</span></span>';
    }
    var extra = v==='cloth' ? '<span class="c tl"></span><span class="c tr"></span><span class="c bl"></span><span class="c br"></span>' : '<span class="tape"></span>';
    return '<span class="snap" style="--r:'+TILT[i%6]+'deg;--pc:'+p.pc+'">'+extra+pic(p)+'</span>';
  }
  function render(){
    var list=more ? PLACES.concat(EXTRA) : PLACES, dark=root.getAttribute('data-mode')==='dark';
    var page=document.getElementById('page');
    page.className='v-'+v;
    var mode='<button type="button" class="mode" data-mode-btn aria-label="'+(dark?'Light':'Dark')+' mode">'+ico(dark?'sun':'moon')+'</button>';
    var title='<h1>Jemma’s <em>Journals</em></h1>', h='';
    if(v==='cloth'){
      h+='<header class="cover gut">'+mode+'<div class="wrap mast">'+title+'<div class="orn"><i></i><b></b><i></i></div></div><span class="ribbon"></span></header><div class="gut"><div class="wrap">';
    } else {
      h+=mode+'<div class="gut"><div class="wrap"><header class="mast">'+(v==='dotted'?'<span class="tape"></span><span class="tape r"></span>':'')+title+'</header>';
    }
    var ph = v==='lined' ? '<span class="polar"><span class="tape"></span>'+photo()+'</span>' : (v==='dotted' ? '<span class="wrapphoto"><span class="tape" style="width:60%"></span>'+photo()+'</span>' : photo());
    h+='<section class="intro">'+ph+'<div><span class="lab">About me</span>'+INTRO+'</div></section>'
      +'<div class="sec"><span class="lab">Contents</span><i></i></div><nav class="cards'+(cov!=='corners'?' jcovers':'')+'" aria-label="Places">';
    list.forEach(function(p,i){
      h+='<a class="card" href="#" data-open="'+esc(p.demo?'':p.name)+'" style="--pc:'+p.pc+'">'+snap(p,i)
        +'<span class="kick lab">'+ROMAN[i]+' · '+esc(p.kind)+'</span><h3>'+esc(p.name)+'</h3>'+aboutPlace(p)
        +'<span class="go">Open '+esc(p.demo?'it':p.name)+' '+ico('arrow-right')+'</span></a>';
    });
    h+='</nav></div></div><footer class="foot gut"><div class="wrap"><b>Jemma’s Journals</b><p class="credits"><span>World maps by 20th Century Plumbob</span><span>Region map and Pokémon pictures from the games</span><span>Covers from the publishers</span><span>Icons by Lucide</span></p></div></footer>';
    page.innerHTML=h;
    root.style.setProperty('--page', getComputedStyle(page).getPropertyValue('--bg') || '#fff');
    document.querySelectorAll('.sw [data-c]').forEach(function(b){ b.setAttribute('aria-pressed', b.dataset.c===cov?'true':'false'); });
    document.getElementById('more').setAttribute('aria-pressed', more?'true':'false');
    try{ localStorage.setItem('jj-c6',cov); }catch(e){}
  }
  render();

  var toast=document.getElementById('toast'), t;
  function say(m){ toast.textContent=m; toast.hidden=false; clearTimeout(t); t=setTimeout(function(){ toast.hidden=true; },1800); }
  document.addEventListener('click',function(e){
    var b=e.target.closest('.sw [data-c]'); if(b){ cov=b.dataset.c; render(); return; }
    if(e.target.closest('#more')){ more=!more; render(); return; }
    if(e.target.closest('[data-mode-btn]')){
      userMode = root.getAttribute('data-mode')==='dark' ? 'light' : 'dark';
      try{ localStorage.setItem('jj-mode',userMode); }catch(err){}
      applyMode(); render(); return;
    }
    var a=e.target.closest('a[data-open]'); if(!a) return;
    e.preventDefault();
    say(a.dataset.open ? 'This would open your '+a.dataset.open : 'A new place would go here');
  });
})();
</script>
